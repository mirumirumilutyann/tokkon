name: Update Tokkon data

on:

  schedule:

    - cron: '17 1 * * *'

      timezone: 'Asia/Tokyo'

  workflow_dispatch:

permissions:

  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.x'

      - name: Scan official campaign pages

        run: python update_deals.py

      - name: Commit changed data

        run: |

          git config user.name 'github-actions[bot]'

          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/deals.json

          git diff --cached --quiet || git commit -m 'chore: auto-update official campaign data'

          git push
